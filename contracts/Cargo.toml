[workspace]
resolver = "2"

members = [
    "casper-mesh-contract",
    "casper_escrow",
    "deposit-proxy",
    "oracle-contract",
    "../hackathon_boost_layer/odra_contracts"
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Triarchy-Labs/casper-agentic-mesh"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
